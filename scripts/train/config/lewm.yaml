defaults:
  - _self_
  - launcher: local
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

# Optional Lightning checkpoint used to resume a run. When unset, preserve
# the existing behavior of loading an exported model checkpoint, if present.
resume_ckpt_path: null
resume_weights_only: false

# Optional exported model state_dict used when a full Lightning checkpoint is
# unavailable. epoch_offset keeps newly exported filenames monotonic.
init_weights_path: null
# Create a deterministic initialization artifact before training. With
# init_only=true the process exits after exporting/validating this state_dict.
export_init_weights_path: null
init_only: false
epoch_offset: 0

# Paired protocols can hash the first N non-pixel training batches in each arm.
pairing_trace_batches: 0
# This guard was added after the original LeWM implementation. It catches a
# bad backward before gradient clipping can turn Inf into NaN and contaminate
# AdamW state. An organic non-finite event is a failure until its generating
# operator is understood; skip is reserved for explicit diagnostics.
nonfinite_grad_policy: error
nonfinite_max_skip_frac: 0.0
nonfinite_max_total_skips: 0

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
gpu_image_preprocess: false
patch_size: 14
encoder_scale: tiny
embed_dim: 192
encoder_resnet9: False
train_value_function: False
projector_loss_weight: 1e-3
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  history_size: 3
  num_preds: 1

model:
  _target_: stable_worldmodel.wm.lewm.LeWM
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.lewm.module.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
