defaults:
  - lewm
  - _self_

# CritWM prototype: closed-loop critical training (thermostat).
# Sensor = greedy echo probe every thermo_every steps (measurement only);
# actuator = gamma on the coupled open-loop K-step term;
# setpoint = per-step worst-direction gain 1.0.
output_model_name: lewm_critwm

wm:
  thermo_k: 5
  thermo_gamma0: 0.3
  thermo_eta: 2.0
  thermo_target: 1.0
  thermo_every: 200
  thermo_rate0: ${wm.thermo_target}
  thermo_ctr0: 0

data:
  dataset:
    num_steps: 8
