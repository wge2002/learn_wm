defaults:
  - lewm
  - _self_

# EchoReg: K=1 supervision + one-sided critical echo penalty (see Part VIII).
# Greedy renormalized perturbation rolled echo_m steps (true actions, no future
# targets needed for the penalty), per-step worst-direction amplification
# beyond 1 penalized. Window 8 = identical to lewm_multistep for comparability.
output_model_name: lewm_echo

wm:
  echo_m: 5
  echo_eps: 1.0
  echo_beta: 1.0

data:
  dataset:
    num_steps: 8
