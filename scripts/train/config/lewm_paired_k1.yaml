defaults:
  - lewm
  - _self_

# Matched teacher-forced K=1 control for the controlled-metric experiment.
# Apply the ordinary one-step LeWM transition at each of the five future
# positions. K1 and K5 therefore use the same eight-frame clips, target frames,
# predictor-call count, encoder/SIGReg work, and optimizer-update budget. The
# only intended intervention is true context versus recursively predicted
# context after the first transition.
output_model_name: lewm_paired_k1

wm:
  unroll_tf: 5

model:
  predictor:
    # K5 calls the predictor five times per batch. Disable stochastic dropout
    # in both arms so call count cannot masquerade as a horizon effect.
    dropout: 0.0

data:
  dataset:
    num_steps: 8

pairing_trace_batches: 3
# Formal validity requires every optimizer update to be finite. The guard still
# saves evidence before failing when SWM_NONFINITE_EVIDENCE_DIR is set.
nonfinite_grad_policy: error
nonfinite_max_skip_frac: 0.0
nonfinite_max_total_skips: 0

trainer:
  deterministic: true
  benchmark: false
