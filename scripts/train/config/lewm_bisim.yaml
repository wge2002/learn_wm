defaults:
  - lewm
  - _self_

# Head-to-head baseline: K=1 single-step + reward-free bisimulation regularizer
# (Invariant-JEPA-WM style; latent metric = discounted next-latent metric).
output_model_name: lewm_bisim

wm:
  aux_reg: bisim
  # Scale-matched on A100: per-batch bisim values can be O(10), so 0.01 keeps
  # the weighted auxiliary comparable to, but below, the K=1 prediction term.
  aux_beta: 0.01
  bisim_gamma: 0.9

data:
  dataset:
    num_steps: 8
